# Hierarchical OAuth 2.1 Authentication Configuration Examples

# Example 1: GitHub OAuth Configuration
global:
  # Server infrastructure
  server:
    host: "127.0.0.1"
    port: 8080
    timeout: 30
    websocket: true
  
  # Tool registry configuration
  registry:
    type: "file"
    paths: ["data/capabilities"]
    hot_reload: true
    validation:
      strict: true
      allow_unknown_fields: false
  
  # OAuth 2.1 authentication
  auth:
    enabled: true
    server_level:
      OAuth21:
        provider: "github"
        client_id: "your_github_client_id_here"
        client_secret: "${OAUTH_CLIENT_SECRET}"
        auth_url: "https://github.com/login/oauth/authorize"
        token_url: "https://github.com/login/oauth/access_token"
        device_code_url: "https://github.com/login/device/code"
        scopes: ["read:user", "user:email"]
        pkce_enabled: true
        resource_indicators: true
  
  # Logging configuration
  logging:
    level: "info"
    format: "json"
  
  # Default settings
  defaults:
    timeout: 30
    retry_attempts: 3

# MCP protocol services
mcp:
  sampling:
    enabled: true
    default_model: "gpt-4"
  elicitation:
    enabled: true
    default_model: "gpt-4"

# Smart discovery services
discovery:
  smart_discovery:
    enabled: true
    tool_selection_mode: "hybrid"

---

