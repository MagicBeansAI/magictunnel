# Example Hierarchical MCP Configuration with Authentication

# Global infrastructure settings (Tier 1)
global:
  # Server infrastructure
  server:
    host: "127.0.0.1"
    port: 8080
    timeout: 30
    websocket: true
  
  # Tool registry configuration
  registry:
    type: "file"
    paths: ["capabilities"]
    hot_reload: true
    validation:
      strict: false
      allow_unknown_fields: true
  
  # Authentication and security
  auth:
    enabled: true
    server_level:
      ApiKey:
        keys: 
          - "admin_key_abcdef123456789"
          - "read_only_key_xyz789456123"
          - "service_key_def456789abc123"
  
  # Logging configuration
  logging:
    level: "info"
    format: "json"
    output: "stdout"
  
  # Security policies
  security:
    request_sanitization:
      enabled: true
      secret_detection: true
      content_filtering: true
    tool_allowlist:
      enabled: false  # Allow all tools by default
      allowed_tools: []
  
  # Default settings (applied across all levels)
  defaults:
    timeout: 30
    retry_attempts: 3
    retry_delay_ms: 1000

# MCP protocol services (Tier 2)
mcp:
  # Protocol-specific overrides
  timeout: 25
  max_retries: 2
  
  # MCP client configuration
  mcp_client:
    connection_timeout_ms: 5000
    request_timeout_ms: 30000
  
  # Sampling service (MCP 2025-06-18)
  sampling:
    enabled: true
    default_model: "gpt-4"
  
  # Elicitation service (MCP 2025-06-18)
  elicitation:
    enabled: true
    default_model: "gpt-4"
  
  # Streamable HTTP transport (preferred)
  streamable_http:
    enabled: true
    max_concurrent_streams: 10

# Smart Discovery AI services (Tier 3)
discovery:
  # Smart discovery configuration
  smart_discovery:
    enabled: true
    tool_selection_mode: "hybrid"  # rule_based | semantic | llm_based | hybrid
    default_confidence_threshold: 0.7
  
  # Tool enhancement services
  tool_enhancement:
    enabled: true
    default_model: "gpt-4"
  
  # Tool visibility management
  visibility:
    hide_individual_tools: false
    default_hidden: false

# Tool-specific overrides (Tier 4)
tools:
  network_ping:
    timeout: 10      # Override global/MCP timeouts
    max_retries: 1   # Override global/MCP retries
    hidden: false    # Override visibility settings
    priority: 5      # Tool priority (0-255)
  
  filesystem_operations:
    timeout: 45      # Longer timeout for file operations
    security_level: "privileged"  # Override default security
    parameters:
      max_file_size: "10MB"
    routing:
      routing_type: "command"
      config:
        working_directory: "/tmp"

# Legacy configurations (automatically migrated)
# Use 'cargo run --bin magictunnel-config-migrate -- convert' to migrate
# from flat configuration format to hierarchical format
